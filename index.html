<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>EP06 타워 브리지 — WebGL 테이크 1 (첫 버전)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Dopamine Story's review page for a film in cuts. A map of every cut leads (its upload calendar), the full film comes
   first, then one card per cut: a band for what changed, the vertical clip, OK / 수정 필요 / 보류 and a memo. */
:root {
  --bg: #f1f3f6;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5b6472;
  --line: #dce0e7;
  --accent: #2747b8; --accent-soft: #e5eafa;   /* a cut that changed in this version */
  --ok: #1d7a46; --ok-soft: #e3f3ea;
  --fix: #b9342a; --fix-soft: #fbe7e5;
  --hold: #9a6a12; --hold-soft: #f8efd9;
  --media-bg: #0d0f12;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1a1d23; --ink: #e9ecf1; --muted: #9ba3b0; --line: #2c313a;
    --accent: #8fa8ff; --accent-soft: #1c2440;
    --ok: #5cc68b; --ok-soft: #15301f; --fix: #ff8a7d; --fix-soft: #3a1c19; --hold: #e6b45a; --hold-soft: #352a12;
    --media-bg: #060708; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1a1d23; --ink: #e9ecf1; --muted: #9ba3b0; --line: #2c313a;
  --accent: #8fa8ff; --accent-soft: #1c2440;
  --ok: #5cc68b; --ok-soft: #15301f; --fix: #ff8a7d; --fix-soft: #3a1c19; --hold: #e6b45a; --hold-soft: #352a12;
  --media-bg: #060708; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 18px 48px; display: grid; gap: 22px; }
.wrap > * { min-width: 0; }
header { display: grid; gap: 7px; }
h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.lead { margin: 0; font-size: 1.05rem; font-weight: 700; text-wrap: balance; }
.next { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.82rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 1px dashed var(--accent);
  border-radius: 999px; padding: 2px 10px; text-decoration: none; white-space: nowrap; }
.chip:hover { text-decoration: underline; }
.sub { margin: 0; color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.sub .n-ok { color: var(--ok); font-weight: 500; }
.sub .n-fix { color: var(--fix); font-weight: 500; }
.sub .n-hold { color: var(--hold); font-weight: 500; }
.notice { margin: 0; color: var(--muted); font-size: 0.88rem; }
.notice[data-warn] { color: var(--fix); font-weight: 500; }
h2 { margin: 0 0 10px; font-size: 0.8rem; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }

/* the map of cuts */
.map { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cell { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 7px 8px 8px; display: grid; gap: 1px;
  min-width: 0; min-height: 68px; align-content: start; color: var(--ink); text-decoration: none; }
.cell .c { font-family: var(--font-mono); font-weight: 500; font-size: 0.8rem; }
.cell .t { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .s { font-size: 0.8rem; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell:hover .c { text-decoration: underline; }
.cell[data-kind="new"] { border: 1px dashed var(--accent); background: var(--accent-soft); }
.cell[data-kind="new"] .s { color: var(--accent); }
.cell[data-status="ok"] { background: var(--ok-soft); border-color: var(--ok); }
.cell[data-status="ok"] .s { color: var(--ok); }
.cell[data-status="fix"] { background: var(--fix-soft); border-color: var(--fix); }
.cell[data-status="fix"] .s { color: var(--fix); }
.cell[data-status="hold"] { background: var(--hold-soft); border-color: var(--hold); }
.cell[data-status="hold"] .s { color: var(--hold); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px;
  border: 1px solid var(--line); background: var(--surface); }
.legend .l-new i { background: var(--accent-soft); border: 1px dashed var(--accent); }
.legend .l-ok i { background: var(--ok-soft); border-color: var(--ok); }
.legend .l-fix i { background: var(--fix-soft); border-color: var(--fix); }
.legend .l-hold i { background: var(--hold-soft); border-color: var(--hold); }

/* folded lists */
.folds { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.folds details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; min-width: 0; }
.folds summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; }
.folds summary b { font-family: var(--font-mono); color: var(--muted); font-weight: 500; margin-left: 4px; }
.folds ul { margin: 8px 0 2px; padding-left: 1.1em; display: grid; gap: 4px; font-size: 0.9rem; }
.folds li b { font-family: var(--font-mono); font-weight: 500; margin-right: 4px; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex;
  flex-direction: column; min-width: 0; scroll-margin-top: 16px; }
.card[data-status="ok"] { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.card[data-status="fix"] { border-color: var(--fix); box-shadow: 0 0 0 1px var(--fix); }
.card[data-status="hold"] { border-color: var(--hold); box-shadow: 0 0 0 1px var(--hold); }
.band { padding: 9px 14px; font-weight: 700; font-size: 0.9rem; border-bottom: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.card[data-kind="new"] .band { background: var(--accent-soft); color: var(--accent); }
.card[data-kind="same"] .band { background: var(--bg); color: var(--muted); font-weight: 500; }
.card[data-kind="full"] .band { background: var(--ink); color: var(--surface); }
.media { background: var(--media-bg); aspect-ratio: 9 / 16; max-width: 100%; }
.media video { width: 100%; height: 100%; object-fit: contain; display: block; }
.info { padding: 12px 14px 14px; display: grid; gap: 8px; min-width: 0; align-content: start; }
.head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.slate { font-family: var(--font-mono); font-weight: 500; font-size: 0.8rem; background: var(--ink); color: var(--surface);
  border-radius: 4px; padding: 1px 7px; }
.card[data-kind="new"] .slate { background: var(--accent); }
.dur { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.state { margin-left: auto; font-size: 0.75rem; font-weight: 700; border-radius: 4px; padding: 1px 8px; color: var(--muted); background: var(--bg); }
.state[data-s="ok"] { color: var(--ok); background: var(--ok-soft); }
.state[data-s="fix"] { color: var(--fix); background: var(--fix-soft); }
.state[data-s="hold"] { color: var(--hold); background: var(--hold-soft); }
.title { margin: 0; font-weight: 700; font-size: 0.98rem; line-height: 1.45; }
.change, .temp { margin: 0; font-size: 0.86rem; line-height: 1.5; }
.change b { color: var(--accent); margin-right: 5px; }
.temp b { color: var(--hold); margin-right: 5px; }
.more { font-size: 0.86rem; color: var(--muted); }
.more summary { cursor: pointer; }
.more p { margin: 6px 0 0; }
.more .en { font-style: italic; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.act { font: inherit; font-size: 0.88rem; font-weight: 500; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.act[data-v="ok"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.act[data-v="fix"][aria-pressed="true"] { background: var(--fix); border-color: var(--fix); color: var(--surface); }
.act[data-v="hold"][aria-pressed="true"] { background: var(--hold); border-color: var(--hold); color: var(--surface); }
.act:disabled, .pick:disabled, textarea:disabled { opacity: 0.55; cursor: not-allowed; }
textarea { font: inherit; font-size: 0.88rem; width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 9px; background: var(--bg); color: var(--ink); }
.saved { font-size: 0.75rem; color: var(--muted); min-height: 1.1em; }

/* the full film: the first thing to watch */
.card.full { display: grid; grid-template-columns: minmax(0, 270px) minmax(0, 1fr); max-width: 780px; }
.card.full .band { grid-column: 1 / -1; }
.card.full .info { padding: 16px 18px; gap: 10px; }
.card.full textarea { min-height: 96px; }
.tracks { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.tracks-h { margin: 0; font-size: 0.8rem; color: var(--muted); font-weight: 700; }
.track { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 4px 10px; align-items: center; }
.track .name { font-weight: 700; font-size: 0.9rem; }
.track .desc { grid-column: 2 / -1; color: var(--muted); font-size: 0.82rem; }
.pick { font: inherit; font-size: 0.82rem; font-weight: 500; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.pick.use[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }

footer { font-size: 0.78rem; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 560px) {
  .map { gap: 4px; }
  .cell { padding: 5px 5px 6px; min-height: 60px; }
  .cell .c { font-size: 0.72rem; }
  .cell .t { font-size: 0.64rem; }
  .cell .s { font-size: 0.72rem; }
  .card.full { display: flex; }
}
@media (max-width: 420px) { .grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Built By Madmen</span> 검수</h1>
    <p class="lead" id="lead"></p>

    <p class="sub" id="sub"></p>

</div>

<script>
const SHEET = {"episode": "EP06 타워 브리지 (Built By Madmen)", "version": "WebGL 블로킹 첫 버전 · 2,205프레임 73.5초 · 녹음 take 1(영상 속도) · 인물은 맨몸, 물건은 실제 크기 상자", "collection": "ep06_take1", "length": "1:13.5", "summary": ["WebGL 단계라 인물은 옷 없는 맨몸, 다리·배·건물은 실제 크기의 단순 상자입니다. 진짜 모델·옷·물·조명은 승인 후 Blender에서 들어갑니다.", "첫 장면 A: 뱃사공(W1) 비명 얼굴 → 배가 돌기둥에 쾅 → 물보라 → 낮은 옛 다리에 배들이 막힌 전경. 뱃사공은 진짜 비명 입모양이 있는 W1으로 했습니다(W5는 옷·GLB 없음).", "새 카메라 규칙: 화면 기울기 0(모든 프레임), 피사체 주위 돌기 없음, 한 번에 27.5°까지만 돌림, 회전 대신 이동, 장소 전환은 컷.", "검사: 8개 검사, 부품 겹침 0(29쌍), 움직임 양(평균 18.1, 정지 0%) 통과. 마지막 프레임 = 첫 프레임(0ms 반복).", "알려드릴 약점: B05 뱃사공이 첫 화면에서 작게 보임 · B06 부러진 돛대가 물에 떨어지는 장면이 컷 뒤로 넘어가 안 보임 · B11 탑 받침 속 단면 장면이 약하게 읽힘."], "placeholders": ["WebGL 첫 버전입니다: 인물은 맨몸 한 가지 색, 물건은 실제 크기 상자, 물보라·먼지는 자리표시 입자입니다.", "소리는 내레이션만 있습니다(효과음·음악은 테이크 확정 후)."], "cuts": [{"id": "c01", "label": "C01", "kind": "new", "tag": "새로", "start": "0:00.0", "end": "0:07.3", "at": "0:00", "say": "The British had completely lost their #@%! minds, because they built a bridge across the Thames, and its pillars blocked every ship.", "ko": "영국인들은 완전히 미쳐버렸습니다. 템스강에 다리를 놓았는데 그 기둥들이 모든 배를 막아버렸거든요.", "picture": "W1 비명 얼굴(뱃머리 난간) → 돌기둥이 다가옴(컷) → 100프레임 배가 기둥에 쾅, 물보라 → (컷) 옛 낮은 다리 앞에 막힌 배들 전경.", "changed": "첫 장면 A", "temp": ""}, {"id": "c02", "label": "C02", "kind": "new", "tag": "새로", "start": "0:07.3", "end": "0:09.8", "at": "0:07", "say": "So a clever engineer came up with a fix.", "ko": "그래서 똑똑한 엔지니어가 해결책을 생각해 냈습니다.", "picture": "강둑의 MAD, 고개 숙였다가 'fix'에 고개를 듦.", "changed": "", "temp": ""}, {"id": "c03", "label": "C03", "kind": "new", "tag": "새로", "start": "0:09.8", "end": "0:13.1", "at": "0:09", "say": "He built two tall towers and hung the road from chains.", "ko": "높은 탑 두 개를 세우고 도로 전체를 쇠사슬에 매달았습니다.", "picture": "옛 기둥이 가라앉고 탑 두 개가 강에 섬(330) → 쇠사슬이 내려와 도로를 매닮(346), 사슬 팽팽(379).", "changed": "", "temp": ""}, {"id": "c04", "label": "C04", "kind": "new", "tag": "새로", "start": "0:13.1", "end": "0:15.1", "at": "0:13", "say": "With the pillars gone, boats could sail through.", "ko": "기둥이 사라지니 배가 지나갈 수 있었죠.", "picture": "수면 높이: 작은 배가 매달린 도로 아래 열린 가운데로 지나감(426).", "changed": "", "temp": ""}, {"id": "c05", "label": "C05", "kind": "new", "tag": "확인", "start": "0:15.1", "end": "0:17.2", "at": "0:15", "say": "But that's where the real problem started.", "ko": "그런데 진짜 문제는 여기서부터였습니다.", "picture": "W1이 탄 큰 범선이 매달린 도로로 다가옴, W1이 도로 끝을 올려다봄.", "changed": "약점: 첫 화면에서 W1이 작게 보임", "temp": ""}, {"id": "c06", "label": "C06", "kind": "new", "tag": "확인", "start": "0:17.2", "end": "0:22.1", "at": "0:17", "say": "Tall sailing ships couldn't fit underneath, so their masts slammed into the road and snapped.", "ko": "키 큰 범선은 아래로 못 지나가서 돛대가 도로에 쾅 부딪혀 부러졌거든요.", "picture": "돛대가 도로 끝에 부딪힘(603) → 부러짐(638) → W1 비명.", "changed": "약점: 부러진 돛대가 물에 떨어지는 순간(682)이 다음 컷 뒤라 안 보임", "temp": ""}, {"id": "c07", "label": "C07", "kind": "new", "tag": "새로", "start": "0:22.1", "end": "0:26.9", "at": "0:22", "say": "Raising the road meant huge ramps on both banks, which ate up land and cost a fortune.", "ko": "도로를 높이려면 양쪽 강둑에 거대한 경사로가 필요해서 땅을 잡아먹고 돈이 엄청 들었죠.", "picture": "도로가 높이 올라가고 경사로가 강둑의 집들을 뚫고 지나감(727~743) → G4 놀람(782).", "changed": "", "temp": ""}, {"id": "c08", "label": "C08", "kind": "new", "tag": "새로", "start": "0:26.9", "end": "0:29.8", "at": "0:26", "say": "And right then, someone had a genius idea.", "ko": "바로 그때, 누군가가 천재적인 생각을 해냈습니다.", "picture": "G4 생각하다가 'genius'에 다리 쪽을 가리킴(855).", "changed": "", "temp": ""}, {"id": "c09", "label": "C09", "kind": "new", "tag": "새로", "start": "0:29.8", "end": "0:32.9", "at": "0:29", "say": "Why not split the road and lift both halves for every ship?", "ko": "배가 올 때마다 도로를 반으로 갈라서 양쪽을 들어 올리면 어떨까요?", "picture": "탑 사이 도로가 가운데서 갈라지고(903) 양쪽이 살짝 들림(931), 돛대가 들어옴(978).", "changed": "", "temp": ""}, {"id": "c10", "label": "C10", "kind": "new", "tag": "새로", "start": "0:32.9", "end": "0:35.2", "at": "0:32", "say": "The engineers did something crazy.", "ko": "엔지니어들이 미친 짓을 했습니다.", "picture": "탑 받침 안의 MAD가 레버 손잡이를 잡음(단면).", "changed": "", "temp": ""}, {"id": "c11", "label": "C11", "kind": "new", "tag": "확인", "start": "0:35.2", "end": "0:39.9", "at": "0:35", "say": "They bolted huge weights onto the back of each half, hidden inside each tower's base.", "ko": "갈라진 도로 양쪽 끝 뒤편에 엄청 무거운 추를 달아 탑 받침 속에 숨겼습니다.", "picture": "탑 받침 단면(유리 18%): 도로 꼬리에 추가 내려와 볼트로 고정(1084, 1106) → 받침 벽이 닫힘(1140).", "changed": "약점: 단면이 화면에서 약하게 읽힘", "temp": ""}, {"id": "c12", "label": "C12", "kind": "new", "tag": "새로", "start": "0:39.9", "end": "0:44.2", "at": "0:39", "say": "Like a seesaw, the weights went down and both halves swung up with barely a push.", "ko": "시소처럼 추가 내려가자 살짝 밀기만 해도 양쪽이 쑥 일어섰습니다.", "picture": "추가 내려가고(1243) 다리 양쪽이 82°까지 일어섬(1283), 카메라가 다리와 함께 올라감 → MAD의 레버 밀기 끝(1307).", "changed": "", "temp": ""}, {"id": "c13", "label": "C13", "kind": "new", "tag": "새로", "start": "0:44.2", "end": "0:46.6", "at": "0:44", "say": "The road went up seventeen times a day.", "ko": "다리는 하루에 열일곱 번이나 열렸죠.", "picture": "빠른 시간 경과: 다리가 세 번 오르내리고 배들이 지나감.", "changed": "", "temp": ""}, {"id": "c14", "label": "C14", "kind": "new", "tag": "새로", "start": "0:46.6", "end": "0:48.6", "at": "0:46", "say": "But another serious problem showed up.", "ko": "그런데 또 심각한 문제가 나타났습니다.", "picture": "탑 꼭대기 쇠사슬 걸이 클로즈업, 삐걱(1430).", "changed": "", "temp": ""}, {"id": "c15", "label": "C15", "kind": "new", "tag": "새로", "start": "0:48.6", "end": "0:53.2", "at": "0:48", "say": "The side chains yanked both tower tops toward the banks, and the towers started to lean.", "ko": "양옆 쇠사슬이 두 탑 꼭대기를 강둑 쪽으로 확 잡아당겨 탑이 기울기 시작했습니다.", "picture": "사슬이 당김(1482) → 두 탑이 바깥으로 5° 기움(1574), G4 놀람.", "changed": "", "temp": ""}, {"id": "c16", "label": "C16", "kind": "new", "tag": "새로", "start": "0:53.2", "end": "0:58.2", "at": "0:53", "say": "So workers tied both tops together with steel bars, and each tower held the other straight.", "ko": "그래서 작업자들이 두 꼭대기를 강철 막대로 묶어, 두 탑이 서로를 꽉 붙잡게 했죠.", "picture": "탑 꼭대기의 W3가 망치질(5번), 강철 막대가 걸림(1670) → 탑이 똑바로 섬(1726).", "changed": "", "temp": ""}, {"id": "c17", "label": "C17", "kind": "new", "tag": "새로", "start": "0:58.2", "end": "0:59.5", "at": "0:58", "say": "And it didn't end there.", "ko": "그리고 여기서 끝이 아니었습니다.", "picture": "걷던 G4가 들려 있는 다리 끝에서 멈춤.", "changed": "", "temp": ""}, {"id": "c18", "label": "C18", "kind": "new", "tag": "새로", "start": "0:59.5", "end": "1:05.5", "at": "0:59", "say": "To let people cross while the road was up, workers laid walkways along those bars, with stairs inside the towers.", "ko": "도로가 들려 있어도 사람이 건너도록 작업자들이 그 강철 막대를 따라 통로를 깔고 탑 안에 계단을 놓았습니다.", "picture": "통로 바닥이 깔림(1855) → 탑 안 계단이 쌓임(1879~1905) → G4가 돛대 위 높은 통로를 건넘(1930).", "changed": "", "temp": ""}, {"id": "c19", "label": "C19", "kind": "new", "tag": "새로", "start": "1:05.5", "end": "1:10.2", "at": "1:05", "say": "Finally, they wrapped the steel towers and their stairs in stone to match the old castle next door.", "ko": "마지막으로 철골 탑과 계단을 돌로 감싸 옆의 오래된 성과 어울리게 했습니다.", "picture": "돌 외벽이 탑을 타고 올라감(1978~2050) → 북쪽 강둑의 런던탑(성)과 한 화면(2069).", "changed": "", "temp": ""}, {"id": "c20", "label": "C20", "kind": "new", "tag": "새로", "start": "1:10.2", "end": "1:13.5", "at": "1:10", "say": "Ships and people still share London's Tower Bridge, all because", "ko": "지금도 배와 사람이 함께 쓰는 런던의 타워 브리지, 이 모든 게 —", "picture": "완성된 다리, 열린 다리 아래로 범선, 통로 위 G4 → 'all because'에 카메라가 W1 얼굴로 내려옴 → 첫 프레임으로 0ms 반복.", "changed": "", "temp": ""}], "soundtracks": []};
const LABEL = { ok: "OK", fix: "수정 필요", hold: "보류", "": "미검수" };
const SHORT = { ok: "OK", fix: "수정", hold: "보류" };
const state = {};      // cut id or "overall" -> {status, note}; "bgm" -> {pick}
const timers = {}, busy = {};
let db = null, writable = true;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const cur = id => state[id] || (state[id] = { status: "", note: "" });
function notice(text, warn) {
  const n = document.getElementById("notice");
  n.textContent = text;
  if (warn) n.dataset.warn = ""; else delete n.dataset.warn;
}
function jump(id) {
  const c = document.getElementById("card-" + id);
  if (!c) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  c.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}
function jumpLink(a, id) { a.href = "#card-" + id; a.addEventListener("click", ev => { ev.preventDefault(); jump(id); }); }

function renderHeader() {
  document.getElementById("lead").textContent = SHEET.episode + " · " + SHEET.version;
  const next = document.getElementById("next");
  const changed = SHEET.cuts.filter(c => c.kind === "new");
  if (!changed.length) { next.textContent = "이번 버전에서 바뀐 컷이 없습니다."; return; }
  next.append("바뀐 컷 " + changed.length + "개부터 봐 주세요");
  const chips = el("span", "chips");
  for (const c of changed) { const a = el("a", "chip", c.label + " " + c.tag); jumpLink(a, c.id); chips.append(a); }
  next.append(chips);
}

function renderSub() {
  let ok = 0, fix = 0, hold = 0;
  for (const c of SHEET.cuts) { const s = cur(c.id).status; if (s === "ok") ok++; else if (s === "fix") fix++; else if (s === "hold") hold++; }
  const sub = document.getElementById("sub");
  sub.textContent = "";
  sub.append("길이 " + SHEET.length + " · 컷 " + SHEET.cuts.length + "개 · 검수 " + (ok + fix + hold) + "/" + SHEET.cuts.length + " · ");
  sub.append(el("span", "n-ok", "OK " + ok), " · ", el("span", "n-fix", "수정 필요 " + fix), " · ", el("span", "n-hold", "보류 " + hold));
  const all = cur("overall").status;
  if (all) sub.append(" · 전체 " + LABEL[all]);
}

function renderMap() {
  const map = document.getElementById("map");
  for (const c of SHEET.cuts) {
    const a = el("a", "cell"); a.id = "cell-" + c.id; a.dataset.kind = c.kind; jumpLink(a, c.id);
    a.append(el("span", "c", c.label), el("span", "t", c.at), el("span", "s"));
    map.append(a);
  }
  paintMap();
}
function paintMap() {
  for (const c of SHEET.cuts) {
    const a = document.getElementById("cell-" + c.id);
    const s = cur(c.id).status;
    a.dataset.status = s;
    a.querySelector(".s").textContent = s ? SHORT[s] : (c.kind === "new" ? "바뀜" : "같음");
    a.setAttribute("aria-label", c.label + " " + c.at + ", " + (c.kind === "new" ? "바뀐 컷" : "지난 버전과 같음") + ", " + LABEL[s]);
  }
}

function renderFolds() {
  const sum = document.getElementById("summary"), temps = document.getElementById("temps");
  for (const t of SHEET.summary) sum.append(el("li", null, t));
  document.getElementById("nsum").textContent = SHEET.summary.length;
  if (!SHEET.summary.length) document.getElementById("sum-box").hidden = true;
  let n = 0;
  for (const c of SHEET.cuts) if (c.temp) { const li = el("li"); li.append(el("b", null, c.label), c.temp); temps.append(li); n++; }
  for (const t of SHEET.placeholders) { temps.append(el("li", null, t)); n++; }
  document.getElementById("ntemp").textContent = n;
  if (!n) document.getElementById("temp-box").hidden = true;
}

function card(c) {
  const full = c.kind === "full";
  const a = el("article", full ? "card full" : "card"); a.id = "card-" + c.id; a.dataset.kind = c.kind; a.dataset.status = "";
  a.append(el("div", "band", full ? "처음부터 끝까지 이어 본 " + SHEET.version : c.kind === "new" ? "바뀜 · " + c.tag : c.tag));
  const media = el("div", "media");
  const v = document.createElement("video");
  v.controls = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", ""); v.preload = "metadata";
  v.poster = full ? "cut_01.jpg" : "cut_" + c.id.slice(1) + ".jpg";
  v.src = full ? "full.mp4" : "cut_" + c.id.slice(1) + ".mp4";
  media.append(v);
  const info = el("div", "info");
  const head = el("div", "head");
  const st = el("span", "state", LABEL[""]); st.id = "state-" + c.id;
  head.append(el("span", "slate", c.label), el("span", "dur", full ? SHEET.length : c.start + "–" + c.end), st);
  info.append(head);
  if (full) {
    info.append(el("p", "title", "전체 흐름을 먼저 보고 전체 의견을 남겨 주세요. 컷별 표시는 아래에서 합니다."));
  } else {
    info.append(el("p", "title", c.ko));
    if (c.kind === "new") { const p = el("p", "change"); p.append(el("b", null, "바뀐 점"), c.changed); info.append(p); }
    if (c.temp) { const p = el("p", "temp"); p.append(el("b", null, "아직 임시"), c.temp); info.append(p); }
    const more = el("details", "more");
    more.append(el("summary", null, "화면 설명과 영어 대사"), el("p", null, c.picture), el("p", "en", c.say));
    info.append(more);
  }
  const actions = el("div", "actions");
  for (const val of ["ok", "fix", "hold"]) {
    const b = el("button", "act", LABEL[val]); b.type = "button"; b.dataset.v = val; b.id = c.id + "-" + val;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => choose(c.id, val));
    actions.append(b);
  }
  const ta = document.createElement("textarea");
  ta.id = "note-" + c.id; ta.rows = full ? 3 : 2;
  ta.setAttribute("aria-label", (full ? "전체" : c.label) + " 메모");
  ta.placeholder = full ? "전체 의견 (예: 길이, 목소리, 음악, 흐름)" : "메모 (예: 물이 늦게 터져요, 카메라가 너무 빨라요)";
  ta.addEventListener("input", () => { cur(c.id).note = ta.value; mark(c.id, "입력 중"); later(c.id); });
  ta.addEventListener("blur", () => { if (timers[c.id]) { clearTimeout(timers[c.id]); delete timers[c.id]; save(c.id); } });
  const saved = el("div", "saved"); saved.id = "saved-" + c.id;
  info.append(actions, ta, saved);
  if (full && (SHEET.soundtracks || []).length > 1) info.append(trackBox(v));
  a.append(media, info);
  return a;
}

// two or more soundtracks: the film's own sound is one, the others play from their own file in step with the muted film
function trackBox(film) {
  const box = el("div", "tracks");
  box.append(el("p", "tracks-h", "음악 후보 · 영상을 튼 채로 '듣기'를 누르면 소리만 바뀝니다. 마음에 드는 곡에 '이걸로'"));
  const alt = document.createElement("audio"); alt.preload = "none";
  let playing = (SHEET.soundtracks.find(t => !t.file) || SHEET.soundtracks[0]).id;
  film.addEventListener("play", () => { if (!film.muted) return; alt.currentTime = film.currentTime; alt.play().catch(() => {}); });
  film.addEventListener("pause", () => alt.pause());
  film.addEventListener("ended", () => alt.pause());
  film.addEventListener("seeked", () => { alt.currentTime = film.currentTime; });
  film.addEventListener("timeupdate", () => { if (film.muted && Math.abs(alt.currentTime - film.currentTime) > 0.12) alt.currentTime = film.currentTime; });
  const paintListen = () => { for (const t of SHEET.soundtracks) document.getElementById("listen-" + t.id).setAttribute("aria-pressed", String(t.id === playing)); };
  for (const t of SHEET.soundtracks) {
    const row = el("div", "track");
    const listen = el("button", "pick", "듣기"); listen.type = "button"; listen.id = "listen-" + t.id;
    const use = el("button", "pick use", "이걸로"); use.type = "button"; use.id = "use-" + t.id; use.setAttribute("aria-pressed", "false");
    listen.addEventListener("click", () => {
      playing = t.id; paintListen();
      if (!t.file) { alt.pause(); film.muted = false; return; }
      film.muted = true; alt.src = t.file; alt.currentTime = film.currentTime;
      if (!film.paused) alt.play().catch(() => {});
    });
    use.addEventListener("click", () => { const s = cur("bgm"); s.pick = s.pick === t.id ? "" : t.id; paintBgm(); later("bgm", 0); });
    row.append(listen, el("span", "name", t.label), use, el("span", "desc", t.desc));
    box.append(row);
  }
  const saved = el("div", "saved"); saved.id = "saved-bgm";
  box.append(saved, alt);
  setTimeout(paintListen, 0);
  return box;
}
function paintBgm() {
  const pick = cur("bgm").pick || "";
  for (const t of SHEET.soundtracks || []) { const b = document.getElementById("use-" + t.id); if (b) b.setAttribute("aria-pressed", String(t.id === pick)); }
}

function paint(id) {
  const card = document.getElementById("card-" + id);
  if (!card) return;
  const s = cur(id);
  card.dataset.status = s.status || "";
  const st = document.getElementById("state-" + id); st.dataset.s = s.status || ""; st.textContent = LABEL[s.status || ""];
  for (const val of ["ok", "fix", "hold"]) document.getElementById(id + "-" + val).setAttribute("aria-pressed", String(s.status === val));
  const t = document.getElementById("note-" + id);
  if (document.activeElement !== t) t.value = s.note || "";
}

function choose(id, val) {
  const s = cur(id);
  s.status = s.status === val ? "" : val;   // a second tap clears the mark
  paint(id); paintMap(); renderSub(); later(id, 0);
}

function later(id, delay = 900) {   // one write per pause in typing
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => { delete timers[id]; save(id); }, delay);
}
function mark(id, text) { const s = document.getElementById("saved-" + id); if (s) s.textContent = text; }

async function save(id) {
  if (!db || !writable) return;
  if (busy[id]) { busy[id].again = true; return; }   // one write at a time per document
  busy[id] = { again: false };
  mark(id, "저장 중…");
  try {
    const s = cur(id);
    const body = id === "bgm" ? { pick: s.pick || "" } : { status: s.status || "", note: s.note || "" };
    body.at = new Date().toISOString();
    await db.doc(SHEET.collection + "/" + id).set(body);
    mark(id, "저장됨");
  } catch (e) {
    if (e && e.code === "invalid_argument") lock("이 화면에서는 검수 표시를 저장할 수 없습니다. 보기 전용으로 열려 있습니다.");
    mark(id, "저장 실패. 잠시 뒤 다시 눌러 주세요");
  } finally {
    const again = busy[id].again;
    delete busy[id];
    if (again) save(id);
  }
}

function lock(text) {
  writable = false;
  notice(text, true);
  for (const b of document.querySelectorAll(".act, .pick.use")) b.disabled = true;
  for (const t of document.querySelectorAll("textarea")) t.disabled = true;
}

async function connect() {
  const [store, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!store) { lock("검수 표시는 claude.ai에 로그인한 상태로 이 페이지를 열어야 저장됩니다."); return; }
  db = store;
  if (user && (await user.can("data.write")) === false) lock("이 화면에서는 검수 표시를 저장할 수 없습니다. 보기 전용으로 열려 있습니다.");
  const waiting = setTimeout(() => notice("저장된 검수 기록을 아직 불러오지 못했습니다. 잠시 뒤 다시 확인해 주세요.", true), 10000);
  db.collection(SHEET.collection).onSnapshot(snap => {
    for (const d of snap.docs) {
      if (timers[d.id] || busy[d.id]) continue;   // the viewer's own edit in progress wins
      const data = d.data() || {};
      if (d.id === "bgm") { state.bgm = { pick: data.pick || "" }; paintBgm(); continue; }
      state[d.id] = { status: data.status || "", note: data.note || "" };
      paint(d.id);
    }
    paintMap(); renderSub();
    if (!(snap.metadata && snap.metadata.fromCache)) {
      clearTimeout(waiting);
      if (writable) notice("컷마다 OK, 수정 필요, 보류를 누르고 메모를 남기면 저장되어 Claude가 읽고 다음 버전에 반영합니다.");
    }
  }, () => {
    clearTimeout(waiting);
    notice("저장된 검수 기록을 불러오지 못했습니다. 새로 표시한 것은 계속 저장을 시도합니다.", true);
  });
}

renderHeader();
renderMap();
renderFolds();
document.getElementById("full-slot").append(card({ id: "overall", label: "전체", kind: "full" }));
for (const c of SHEET.cuts) document.getElementById("grid").append(card(c));
renderSub();
function encodeMarks(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeMarks(str) {
  let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function connectLocal() {
  const LS_KEY = "bbm_review_" + SHEET.collection;
  const applyData = (obj) => {
    for (const [id, data] of Object.entries(obj || {})) {
      if (timers[id] || busy[id]) continue;
      if (id === "bgm") { state.bgm = { pick: data.pick || "" }; paintBgm(); continue; }
      state[id] = { status: data.status || "", note: data.note || "" };
      paint(id);
    }
    paintMap(); renderSub();
  };
  let serverOk = false;
  if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
    try {
      const r = await fetch("/api/marks", { cache: "no-store" });
      if (r.ok) { applyData(await r.json()); serverOk = true; }
    } catch (_) {}
  }
  if (!serverOk) {
    try { applyData(JSON.parse(localStorage.getItem(LS_KEY) || "{}")); } catch (_) {}
  }
  const hashMatch = location.hash.match(/#s=([A-Za-z0-9_-]+)/);
  if (hashMatch) {
    try {
      const shared = decodeMarks(hashMatch[1]);
      applyData(shared);
      try { localStorage.setItem(LS_KEY, JSON.stringify(shared)); } catch (_) {}
    } catch (_) {}
  }
  const collectAll = () => {
    const out = {};
    const ov = cur("overall");
    if (ov.status || ov.note) out.overall = { status: ov.status || "", note: ov.note || "" };
    for (const c of SHEET.cuts) {
      const s = cur(c.id);
      if (s.status || s.note) out[c.id] = { status: s.status || "", note: s.note || "" };
    }
    if (state.bgm && state.bgm.pick) out.bgm = { pick: state.bgm.pick };
    return out;
  };
  db = {
    doc(path) {
      const id = path.split("/").pop();
      return {
        async set(body) {
          let all = {};
          try { all = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (_) {}
          all[id] = body;
          try { localStorage.setItem(LS_KEY, JSON.stringify(all)); } catch (_) {}
          if (serverOk) {
            const resp = await fetch("/api/marks", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id, body }),
            });
            if (!resp.ok) throw new Error("save failed");
          }
        }
      };
    }
  };
  const copyToClip = async (text, btn, okLabel) => {
    const orig = btn.textContent;
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = okLabel;
      setTimeout(() => { btn.textContent = orig; }, 1800);
    } catch (_) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try {
        document.execCommand("copy");
        btn.textContent = okLabel;
        setTimeout(() => { btn.textContent = orig; }, 1800);
      } catch (__) {
        prompt("아래 내용을 복사해 붙여넣어 주세요:", text);
      }
      ta.remove();
    }
  };
  const bar = el("div", "actions");
  bar.style.marginTop = "4px";
  const copyBtn = el("button", "act", "채팅용 검수 결과 복사");
  copyBtn.type = "button";
  copyBtn.style.fontWeight = "700";
  copyBtn.addEventListener("click", () => {
    const lines = ["## " + SHEET.episode + " · " + SHEET.version];
    const ov = cur("overall");
    if (ov.status || ov.note) lines.push("- 전체: [" + (LABEL[ov.status] || "미검수") + "] " + (ov.note || ""));
    for (const c of SHEET.cuts) {
      const s = cur(c.id);
      if (s.status || s.note) lines.push("- " + c.label + " (" + c.start + "–" + c.end + "): [" + (LABEL[s.status] || "미검수") + "] " + (s.note || ""));
    }
    if (lines.length === 1) lines.push("- (아직 표시된 항목 없음)");
    copyToClip(lines.join("\n"), copyBtn, "복사됨! 채팅에 붙여넣으세요");
  });
  const linkBtn = el("button", "act", "메모 포함 링크 복사");
  linkBtn.type = "button";
  linkBtn.addEventListener("click", () => {
    const url = location.origin + location.pathname + "#s=" + encodeMarks(collectAll());
    copyToClip(url, linkBtn, "링크 복사됨!");
  });
  const dlBtn = el("button", "act", "JSON 저장");
  dlBtn.type = "button";
  dlBtn.addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(collectAll(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = SHEET.collection + "_marks.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  bar.append(copyBtn, linkBtn, dlBtn);
  document.getElementById("notice").after(bar);
  notice(serverOk
    ? "로컬 검수 서버에 연결됨 — OK / 수정 필요 / 보류와 메모가 marks.json에 즉시 저장됩니다. 다 보시면 '검수표 확인해'라고 말씀해 주세요."
    : "온라인 검수표 — 선택과 메모는 이 기기에 자동 저장됩니다. 다 보시면 '채팅용 검수 결과 복사'를 눌러 채팅에 바로 붙여넣어 주세요.");
}
if (window.claude && claude.use) connect(); else connectLocal();
</script>
